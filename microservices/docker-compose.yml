services:
  clip:
    build:
      context: .
      dockerfile: Dockerfile
      target: clip
    ports:
      - "8002:8002"
    environment:
      - CLIP_MODEL_NAME=openai/clip-vit-base-patch32
      - MAX_FILE_SIZE_MB=10
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=*
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G

  embed:
    build:
      context: .
      dockerfile: Dockerfile
      target: embed
    ports:
      - "8003:8003"
    environment:
      - EMBED_MODEL_NAME=BAAI/bge-small-en-v1.5
      - MAX_BATCH_SIZE=128
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=*
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
