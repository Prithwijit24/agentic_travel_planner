nararouter:
  base_url: https://router.bynara.id/v1/
  api_type: openai
  planner_model: [agnes-2.5-flash, mistral-large]
  worker_model: [agnes-2.0-flash, mistral-medium-3-5]

opencode:
  base_url: https://opencode.ai/zen/v1/
  api_type: openai
  planner_model: deepseek-v4-flash-free
  worker_model: big-pickle

# ── LLM provider tuning ─────────────────────────────────────────────────
llm_call_timeout_seconds: 120.0
llm_planner_timeout_seconds: 180.0
llm_cooldown_rate_limit_floor: 120.0
llm_cooldown_timeout_floor: 300.0
llm_cooldown_max_seconds: 900.0
llm_gateway_error_hint_prefix_length: 80

# ── LLM provider core ─────────────────────────────────────────────────
llm_provider_priority: ["agnes", "grokai", "gemini", "nararouter", "llm7io", "opencode", "oraclellm"]
llm_gateway_error_hints:
  - "streaming response failed"
  - "request queue is full"
  - "server error"
  - "upstream service error"
  - "the upstream server"
llm_prompt_field_providers: ["oraclellm"]

# ── LLM provider API key env-var aliases ───────────────────────────────
llm_api_key_aliases:
  oraclellm: ["oraclellm_api_key"]
  agnes: ["agnes_api_key"]
  nararouter: ["nararouter_api_key"]
  llm7io: ["llm7io_api_key"]
  opencode: ["opencode_api_key"]
  openrouter: ["openrouter_api_key"]
  grokai: ["grokai_api_key", "groqai_api_key"]
  nvidia: ["nvidia_api_key"]
  morphllm: ["morphllm_api_key"]
  gemini: ["gemini_api_key"]
  ollama: ["ollama_api_key"]
  omniroute: ["omniroute_api_key", "omnirute_api_key"]
