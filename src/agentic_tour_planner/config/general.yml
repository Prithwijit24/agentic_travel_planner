app_env: development
app_name: Agentic Travel Planner
log_level: INFO

# Bind host for the FastAPI server. Use 127.0.0.1 for local-only access;
# 0.0.0.0 exposes the API on all interfaces (needed when serving the UI
# from a different host/container).
api_host: "0.0.0.0"
# AI Infra Stack integration
ai_stack_base_url: "https://aistackapi.duckdns.org"
ai_stack_admin_user: "admin"
ai_stack_admin_pass: ""
ai_stack_token: ""
# X-API-Key for AI Infra Stack requests. When empty, the client falls back to
# JWT_SECRET (works for this deployment) and then to admin login.
ai_stack_api_key: ""
# Client-side request timeout in seconds (server-side cap is 1000s).
# Pipeline (search -> crawl -> rerank) can take minutes, so don't use the
# old 60s default here.
ai_stack_timeout_seconds: 1000.0

# Graph database (Neo4j)
neo4j_uri: "bolt://localhost:7687"
neo4j_user: "neo4j"
neo4j_password: "changeme"

# Vector database (ChromaDB)
chroma_persist_dir: "src/agentic_tour_planner/data/chroma"

# Feature flags
use_graph_db: true
use_rag_reformulation: false
