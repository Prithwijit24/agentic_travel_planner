[project]
name = "agentic-travel-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prithwijit24", email = "ghoshprithwijit39@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "duckdb>=1.5.5",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "langchain>=1.3.16",
    "langgraph>=1.2.11",
    "langsmith>=0.11.1",
    "neo4j>=6.2.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "redis>=8.1.0",
]

[project.scripts]
agentic-travel-planner = "agentic_travel_planner:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
