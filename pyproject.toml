[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "agentic-travel-planner"
version = "0.1.0"
description = "Agentic travel planner with LLM planning workers, detailed itineraries, and destination imagery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Prithwijit" }]
dependencies = [
  "ddgs>=9.14.4",
  "fastapi>=0.115.0",
  "folium>=0.15.0",
  "graphifyy>=0.8.14",
  "httpx>=0.27.2",
  "loguru>=0.7.3",
  "marisa-trie>=0.8.0",
  "Pillow>=10.0",
  "prometheus-client>=0.21.0",
  "pydantic>=2.10.2",
  "pyyaml>=6.0",
  "rapidfuzz>=3.0.0",
  "sse-starlette>=3.4.6",
  "streamlit>=1.40.2",
  "streamlit-folium>=0.19.0",
  "streamlit-searchbox>=0.1.24",
  "typer>=0.15.1",
  "uvicorn>=0.32.1",
]

[project.scripts]
tour-planner-api = "agentic_tour_planner.api.main:run"
tour-planner-ui = "agentic_tour_planner.app.streamlit_app:run"
tour-planner-plan = "agentic_tour_planner.cli.plan:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_tour_planner"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests that hit real external services (need live API keys)",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-anyio>=0.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.11.13",
    "mypy>=1.17.0",
    "bandit[toml]>=1.8.3",
    "detect-secrets>=1.5.0",
]

# ── Ruff (linter + formatter) ────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]
# Notebooks are execution checkpoints (partial cells, not lintable source);
# instructions_and_next_step_implementations is reference material, not live code.
exclude = [
    "notebooks",
    "src/agentic_tour_planner/instructions_and_next_step_implementations",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit (security)
    "BLE",  # flake8-blind-except
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "TID",  # flake8-tidy-imports
    "SLF",  # flake8-self
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "S101",    # use of assert (fine in tests)
    "S324",    # insecure hash (sha1 used for non-crypto hashing)
    "B008",    # function call in default argument (FastAPI Depends)
    "T201",    # print found (allowed in CLI tools)
    "RET504",  # unnecessary assignment before return
    "BLE001",  # blind except (many fallback handlers need this)
    "FBT",     # boolean trap (too noisy for existing codebase)
    "ARG002",  # unused method argument (interfaces/callbacks)
    "TC",      # type-checking imports (pre-existing pattern)
]

[tool.ruff.lint.per-file-ignores]
# Test suites intentionally: use assert (S101), pass fake secrets to API fixtures
# (S105/S106), exercise private members under test (SLF001), keep pytest fixture
# argument names (ARG001/A002), and rely on simple throwaway flow variables
# (B007/F841/RUF059). Production code is still fully checked for all of these.
"tests/**/*.py" = [
    "S101",
    "S105",
    "S106",
    "SLF001",
    "A002",
    "ARG001",
    "B007",
    "F841",
    "RUF059",
]
"**/__init__.py" = ["F401"]
# Standalone diagnostic scripts: they print (T20), exercise private provider/
# tool internals (SLF001), and use test_-named CLI helpers that are not pytest
# tests (PT028).
"scripts/**/*.py" = ["T20", "SLF001", "PT028"]
"src/agentic_tour_planner/cli/**/*.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_tour_planner"]

# ── Mypy ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = [
    "src/agentic_tour_planner/instructions_and_next_step_implementations",
]

# ── Bandit (security SAST) ───────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", "notebooks", "examples"]
skips = ["B101"]  # allow assert in non-test code
