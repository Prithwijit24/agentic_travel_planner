# See https://prek.j178.dev for more information.
# Hooks grouped: hygiene, linting, security, docker, commit-msg

default_install_hook_types: [pre-commit, commit-msg]

repos:
  # -- General Hygiene --
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: detect-private-key


  # -- Ruff: Linting + Formatting --
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # -- Type Checking (mypy) --
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, types-PyYAML]
        args: [--ignore-missing-imports]
        pass_filenames: false
        entry: mypy src/
        files: \.py$

  # -- Security: Secret Detection --
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        language_version: python3.11

  # -- Security: Bandit (Python SAST) --
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        files: \.py$
        exclude: ^tests/

  # -- Docker: Hadolint (Dockerfile linting) --
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3013, --ignore, DL3059]

  # -- Schema Validation (docker-compose) --
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.33.0
    hooks:
      - id: check-compose-spec
        name: validate docker-compose schema
        files: docker-compose\.ya?ml$

  # -- Prevent .env Leaks (local hook) --
  - repo: local
    hooks:
      - id: forbid-env-files
        name: forbid .env files in commit
        entry: >-
          bash -c
          'git diff --cached --name-only --diff-filter=A
          | grep -qE "\.env($|\.)"
          && echo "ERROR: .env files must not be committed"
          && exit 1
          || true'
        language: system
        pass_filenames: false

  # -- Commit Message Linting (conventional commits) --
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
